services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ova
      POSTGRES_USER: ova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - ova_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ova -d ova"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-mock}
      ENABLE_TEST_AUTH: ${ENABLE_TEST_AUTH:-false}
      DEV_TEST_SECRET: ${DEV_TEST_SECRET:-}
      DATABASE_URL: postgresql+psycopg://ova:${POSTGRES_PASSWORD}@db:5432/ova
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal

  caddy:
    profiles: ["vps"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Define SITE_ADDRESS en .env}
      PILOT_USER: ${PILOT_USER:?Define PILOT_USER en .env}
      PILOT_PASSWORD_HASH: ${PILOT_PASSWORD_HASH:?Define PILOT_PASSWORD_HASH en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/index.html:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - internal
      - edge

volumes:
  ova_db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  edge: