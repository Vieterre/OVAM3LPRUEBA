services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ova
      POSTGRES_USER: ova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - ova_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ova -d ova"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-mock}
      ENABLE_TEST_AUTH: ${ENABLE_TEST_AUTH:-false}
      DEV_TEST_SECRET: ${DEV_TEST_SECRET:-}
      DATABASE_URL: postgresql+psycopg://ova:${POSTGRES_PASSWORD}@db:5432/ova
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal

volumes:
  ova_db_data:

networks:
  internal:
    internal: true

